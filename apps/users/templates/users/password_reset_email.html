<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        .container {
            font-family: "Microsoft JhengHei", Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-img {
            max-width: 180px;
            height: auto;
            display: block;
            margin: 0 auto;
        }

        .content {
            color: #374151;
            line-height: 1.8;
            padding: 0 20px;
        }

        .button {
            display: block;
            width: 220px;
            margin: 30px auto;
            padding: 14px;
            background-color: #3b4252;
            color: #ffffff !important;
            text-align: center;
            text-decoration: none;
            border-radius: 9999px;
            font-weight: bold;
        }

        .footer {
            font-size: 12px;
            color: #9ca3af;
            text-align: center;
            margin-top: 40px;
            border-top: 1px solid #f3f4f6;
            padding-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <a href="https://www.yueswater.com">
                <img src="https://res.cloudinary.com/dqgkc0acd/image/upload/v1769353075/logo_lightTheme_dhbndv.png"
                    alt="岳氏礦泉水" class="logo-img">
            </a>
        </div>
        <div class="content">
            <p>你好 {{ username }}，</p>
            <p>我們收到了重置您岳氏礦泉水帳號密碼的請求。請點擊下方按鈕以設定您的新密碼：</p>
            <a href="{{ reset_link }}" class="button">重設密碼</a>
            <p style="font-size: 14px; color: #6b7280;">此重設連結具有時效性，且僅能使用一次。如果您並未請求重設密碼，請忽略此封郵件，您的密碼將保持不變。</p>
        </div>
        <div class="footer">
            &copy; {{ current_year }} 岳氏礦泉水. 版權所有。
        </div>
    </div>
</body>

</html>
