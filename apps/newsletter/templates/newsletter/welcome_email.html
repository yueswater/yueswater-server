<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>歡迎訂閱岳氏礦泉水</title>
</head>

<body
    style="margin: 0; padding: 0; background-color: #f4f4f5; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">

    <table border="0" cellpadding="0" cellspacing="0" width="100%"
        style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; margin-top: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">

        <tr>
            <td
                style="padding: 40px 40px 20px 40px; text-align: center; background-color: #ffffff; border-bottom: 1px solid #f0f0f0;">
                <h1 style="margin: 0; color: #18181b; font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">
                    岳氏礦泉水
                </h1>
                <p style="margin: 5px 0 0 0; color: #71717a; font-size: 14px;">Tech Blog & Sharing</p>
            </td>
        </tr>

        <tr>
            <td style="padding: 40px;">
                <p style="margin: 0 0 20px 0; font-size: 16px; line-height: 1.6; color: #3f3f46;">
                    嗨，<strong>{{ nickname }}</strong>！
                </p>

                <p style="margin: 0 0 20px 0; font-size: 16px; line-height: 1.6; color: #3f3f46;">
                    非常感謝您訂閱岳氏礦泉水的技術部落格電子報。<br>
                    很高興能與您分享關於全端開發、Python 與現代網頁技術的心得。
                </p>

                <p style="margin: 0 0 20px 0; font-size: 16px; line-height: 1.6; color: #3f3f46;">
                    我們將不定期發送最新的文章摘要給您，絕不會發送垃圾郵件，請放心。
                </p>

                <div style="text-align: center; margin: 30px 0;">
                    <a href="{{ blog_url }}" target="_blank"
                        style="display: inline-block; padding: 12px 24px; background-color: #434c5e; color: #f2f2f2; text-decoration: none; border-radius: 999px; font-weight: bold; font-size: 16px;">
                        前往部落格閱讀
                    </a>
                </div>

                <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #3f3f46;">
                    祝 順心，<br>
                    <strong>岳氏礦泉水</strong>
                </p>
            </td>
        </tr>

        <tr>
            <td style="padding: 30px; background-color: #fafafa; text-align: center; border-top: 1px solid #f0f0f0;">
                <p style="margin: 0 0 10px 0; font-size: 12px; color: #a1a1aa;">
                    © {{ current_year }} 岳氏礦泉水. All rights reserved.
                </p>
                <p style="margin: 0; font-size: 12px; color: #a1a1aa;">
                    如果您不想再收到此類信件，可以 <a href="#" style="color: #71717a; text-decoration: underline;">取消訂閱</a>
                </p>
            </td>
        </tr>
    </table>

</body>

</html>
