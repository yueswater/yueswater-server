[tool.poetry]
package-mode = false

[project]
name = "yueswaterserver"
version = "0.1.0"
description = ""
authors = [{ name = "Anthony Sung", email = "sungpinyue@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.0.1,<7.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "django-unfold (>=0.75.0,<0.76.0)",
    "markdown (>=3.10,<4.0)",
    "django-cors-headers (>=4.9.0,<5.0.0)",
    "pillow (>=12.1.0,<13.0.0)",
    "djangorestframework-simplejwt (>=5.5.1,<6.0.0)",
    "django-simplemde (>=0.1.4,<0.2.0)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "better-profanity (>=0.7.0,<0.8.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "gunicorn (>=24.1.1,<25.0.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "dj-database-url (>=3.1.0,<4.0.0)",
    "whitenoise (>=6.11.0,<7.0.0)",
    "django-storages[s3] (>=1.14.6,<2.0.0)",
    "cloudinary (>=1.44.1,<2.0.0)",
    "django-cloudinary-storage (>=0.3.0,<0.4.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=25.12.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
]

# Format settings
[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
